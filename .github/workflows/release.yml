name: Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Thin caller for the canonical reusable release pipeline. The build →
# semantic-release → Docker → MCP Registry → security chain (tag-based release
# detection + correct gating) lives in wyre-technology/.github so every *-mcp
# repo stays in lockstep instead of drifting per-repo. PR-time lint/test gating
# is each repo's ci.yml concern; this workflow only runs the release path.
# Caller jobs grant the token scopes the reusable jobs request (a reusable can
# only reduce, never expand, caller-granted scope).
jobs:
  release:
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
      id-token: write
      security-events: write
    uses: wyre-technology/.github/.github/workflows/mcp-server-release.yml@d28a612a00a1bd0c36aff09e686ce2d1e10ef552
    with:
      server-name: afkbot-mcp
      image-name: ghcr.io/wyre-technology/afkbot-mcp
    secrets: inherit

  deploy:
    needs: release
    # afkbot-mcp is Aaron's internal PTO-bot tool, not a public MCP-registry
    # vendor connector -- server.json was deliberately added then reverted
    # same-day on 2026-04-29 (PR #2 -> revert PR #3), and Aaron's 2026-08-19
    # decision (batch 3, item 5) confirmed that revert stands: REMOVE the
    # registry-publish step's ability to gate deploy, do not add server.json
    # back. The reusable release.yml has no per-repo opt-out for its
    # mcp-registry sub-job, so it fails here on the missing server.json,
    # which marks the whole `release:` call above "failure" from this
    # caller's point of view -- gating deploy on plain job success would
    # skip a real, working deploy every single release. `always()` bypasses
    # that specific expected failure; the `digest != ''` check keeps this
    # job from running on a GENUINE upstream failure (e.g. the docker job
    # itself breaking), since digest is only ever populated once an image
    # has actually been built and pushed.
    if: >
      always() &&
      needs.release.outputs.released == 'true' &&
      needs.release.outputs.digest != ''
    permissions:
      id-token: write
      contents: read
    uses: wyre-technology/.github/.github/workflows/mcp-server-deploy.yml@a61021de876d0fd44dac777fa90f963fea25b0c3
    with:
      vendor-slug: afkbot
      image-name: ghcr.io/wyre-technology/afkbot-mcp
      digest: ${{ needs.release.outputs.digest }}
      version: ${{ needs.release.outputs.version }}
    secrets: inherit
